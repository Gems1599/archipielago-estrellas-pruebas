*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#a8defd 0%,#dff4ff 28%,#fff2d1 60%,#ffe6f3 100%) fixed}
body{font-size:18px;line-height:1.5}

.header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 18px;background:#fffffff1;backdrop-filter:blur(8px);border-bottom:1px solid #edf2fb;box-shadow:0 8px 26px rgba(90,120,170,.12)}

.map-canvas{position:relative;flex:1;min-height:430px;border-radius:28px;background:linear-gradient(180deg,#9fddff 0%,#cff0ff 18%,#e6f9ff 40%,#fdecb7 62%,#8dd27d 63%,#7bc66e 100%);overflow:hidden;border:1px solid #fff}
.sun{position:absolute;right:5%;top:7%;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffad8 0 22%,#ffe27c 23% 56%,#fabb43 57%);box-shadow:0 0 34px rgba(255,212,110,.75)}
.cloud{position:absolute;height:34px;background:#fff;border-radius:999px;filter:drop-shadow(0 8px 16px rgba(120,150,190,.12));animation:float 8s ease-in-out infinite}
.cloud:before,.cloud:after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:34px;height:34px;left:8px;top:-12px}.cloud:after{width:44px;height:44px;right:10px;top:-18px}
.c1{left:4%;top:13%;width:110px;animation-delay:-2s}.c2{left:35%;top:8%;width:126px}.c3{right:24%;top:19%;width:116px;animation-delay:-5s}
.faro{position:absolute;left:50%;transform:translateX(-50%);bottom:16%;width:118px;height:190px}.faro .glow{position:absolute;left:-48px;bottom:125px;width:214px;height:150px;background:radial-gradient(circle at 50% 68%,rgba(255,241,142,.0) 0 18%,rgba(255,238,123,.3) 30%,rgba(255,255,255,0) 74%);animation:beam 4s ease-in-out infinite}.faro .base{position:absolute;left:22px;bottom:0;width:74px;height:125px;background:linear-gradient(180deg,#fff3ec,#ffe3d3);clip-path:polygon(18% 100%,0 8%,100% 8%,82% 100%);border:3px solid #d58f74;border-bottom:5px solid #d58f74}.faro .roof{position:absolute;left:12px;bottom:117px;width:95px;height:26px;background:#d34f59;border:3px solid #b34652;border-radius:16px 16px 8px 8px}.faro .top{position:absolute;left:31px;bottom:137px;width:56px;height:31px;background:#fff;border:3px solid #8eb5d0;border-bottom-width:4px;border-radius:10px 10px 6px 6px}.faro .star{position:absolute;left:39px;bottom:168px;font-size:1.55rem;filter:drop-shadow(0 0 10px rgba(255,237,156,.9));animation:pulse 2s ease-in-out infinite}
.island-btn{position:absolute;display:flex;flex-direction:column;align-items:center;background:none;box-shadow:none;padding:0;border:0;gap:7px}.island-card{width:min(210px,24vw);min-width:148px;background:#ffffffde;border:2px solid #fff;border-radius:26px;padding:10px 10px 12px;box-shadow:0 14px 28px rgba(70,105,160,.15);text-align:center}.island-card.complete{box-shadow:0 0 0 3px rgba(255,255,255,.65),0 0 28px rgba(255,245,140,.8),0 12px 28px rgba(70,105,160,.18)}
.mini-illustration{position:relative;height:112px;border-radius:20px;overflow:hidden;margin-bottom:8px;border:2px solid #fff;background:var(--bg);box-shadow:inset 0 5px 24px rgba(255,255,255,.35)}.mini-illustration .floor{position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(180deg,#8cd17e,#6fbf64)}
.worldbadge{position:absolute;left:8px;top:8px;padding:5px 8px;background:#ffffffd4;border-radius:999px;font-size:.74rem;font-weight:800}.lightbadge{position:absolute;right:8px;top:8px;background:#fff8bf;border:1px solid #ffe999;color:#7f641a;padding:3px 8px;border-radius:999px;font-size:.75rem;font-weight:900;animation:pulse 1.8s ease-in-out infinite}
.mini-title{font-size:.96rem;font-weight:900;line-height:1.12}.mini-status{font-size:.78rem;color:#4c6482;font-weight:800}.houses{display:flex;gap:4px;justify-content:center;align-items:center;margin-top:4px}
.path-wrap{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:10px;margin-top:16px}.node{min-height:56px;border-radius:18px;padding:6px 8px;background:#fff;border:2px solid #d7e3f7;font-weight:900;display:grid;place-items:center;font-size:1rem}.node.current{background:#eaf2ff;border-color:#6e90ee;box-shadow:0 0 0 4px #dbe5ff}.node.ok{background:#e7faef;border-color:#6bc08d}.node.miss{background:#fff2de;border-color:#efab68}.node.locked{background:#f7f9fe;color:#7d8da5}
.progress-banner{padding:14px 16px;border-radius:24px;background:linear-gradient(145deg,#fff,#eef4ff);border:1px solid #e4edfb;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.bar{height:14px;border-radius:999px;background:#dde8f7;overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,#6db9ff,#70dc9c);transition:width .3s}
.world-stage{min-height:230px;border-radius:24px;background:linear-gradient(180deg,var(--w1) 0%,#fff 100%);position:relative;overflow:hidden;border:2px solid #fff}.world-stage .ground{position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(180deg,var(--w2),var(--w3))}.speech{position:absolute;right:120px;top:20px;max-width:270px;background:#fff;border-radius:20px;padding:12px 14px;font-weight:700;border:2px solid #fff;box-shadow:0 8px 22px rgba(80,110,170,.13)}.avatar-slot,.companion-slot{position:absolute;bottom:16px}.avatar-slot{left:22px}.companion-slot{right:22px}.stage-detail{position:absolute}
.sidecol{display:grid;gap:18px}.compact{display:grid;gap:10px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:18px;background:#f7faff;border:1px solid #e1e9f8}.garden-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:10px}.decor{height:60px;border-radius:16px;background:#fff;border:1px solid #ebf0fb;display:grid;place-items:center;font-size:1.8rem;box-shadow:0 6px 18px rgba(110,140,180,.08)}
.medals{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.medal{position:relative;border-radius:24px;padding:18px 16px;background:radial-gradient(circle at 30% 25%,#ffffff 0,#f4f8ff 50%,#dae8ff 100%);border:3px solid #c3d7fa;text-align:center;overflow:hidden;min-height:170px}.medal.plus{background:radial-gradient(circle at 30% 25%,#fffef0 0,#fff6c8 45%,#ffe48e 100%);border-color:#e2b53d}.medal.locked{opacity:.45;filter:grayscale(.35)}.medal .icon{font-size:2.7rem;display:block;margin-bottom:8px;animation:pulse 2s ease-in-out infinite}.medal.unlock{animation:medalIn .8s ease both}
.question-card{padding:18px;border-radius:26px;background:#fff;border:1px solid #eff3fb;box-shadow:0 16px 45px rgba(44,71,122,.14)}.prompt-title{font-size:clamp(1.25rem,2.3vw,1.6rem);font-weight:900;margin-bottom:16px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.option{background:#f4f7ff;border:2px solid #cad8f7;text-align:left;min-height:64px;padding:14px}.option.selected{background:#dfe8ff;border-color:#6f8ee7}.selectline{display:grid;gap:8px;padding:12px;border-radius:18px;background:#f5f8ff;margin:8px 0;border:1px solid #e1e8f8}.hint{margin-top:14px;padding:14px 16px;border-radius:20px;background:#fff8d4;border:1px solid #f3e6a2}.feedback{margin-top:14px;padding:16px;border-radius:22px;border-left:8px solid var(--success);background:#f0fbf3}.feedback.error{border-left-color:#ee9868;background:#fff5ef}.confetti{font-size:2rem}
.avatar-editor{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px}.avatar-box{display:flex;align-items:center;gap:14px;padding:12px;border-radius:22px;background:#f7fbff;border:1px solid #e5edf8}.avatar-stage{min-height:390px;display:grid;place-items:center;border-radius:26px;background:linear-gradient(180deg,#dff5ff,#fef4d7 62%,#90cf7f 62%,#82c970 100%);border:2px solid #fff;position:relative;overflow:hidden}.optgroup{padding:14px;border-radius:20px;background:#f7fbff;border:1px solid #e5edf8}.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cdd9ee;cursor:pointer}.swatch.active{box-shadow:0 0 0 3px #4a6ce0,0 0 0 6px #dce6ff}.choice{padding:8px 12px;border-radius:14px;background:#fff;border:2px solid #d5e0f5}.choice.active{background:#dfe7ff;border-color:#6886e5}.milestone{padding:12px 14px;border-radius:20px;background:#ffffffd8;border:1px solid #e3ecfa}
.modal-backdrop{position:fixed;inset:0;background:rgba(28,40,70,.38);display:grid;place-items:center;padding:18px;z-index:50}.modal{max-width:560px;width:min(100%,560px);background:linear-gradient(180deg,#fff,#f7fbff);border-radius:30px;padding:22px;border:1px solid #fff;box-shadow:0 24px 60px rgba(24,39,71,.25);text-align:center;position:relative;overflow:hidden}.modal:before{content:'';position:absolute;inset:-30% -20% auto -20%;height:160px;background:radial-gradient(circle,#fff7c6,rgba(255,255,255,0) 70%)}.modal .burst{font-size:3rem;animation:pop .8s ease}.footer-note{text-align:center;color:#61748f;font-size:.84rem;padding:12px 16px 6px}.hidden{display:none!important}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes beam{0%,100%{transform:skewX(0deg) scaleX(1)}50%{transform:skewX(-8deg) scaleX(1.04)}}@keyframes medalIn{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{transform:scale(1.08) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0)}}@keyframes pop{0%{transform:scale(.5);opacity:0}80%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@media (max-width:1100px){.dashboard,.route,.question-grid,.avatar-editor{grid-template-columns:1fr}.hero{min-height:unset}.map-canvas{min-height:480px}}
@media (max-width:760px){main{padding:12px}.header{padding:12px}.topnav{width:100%;justify-content:flex-start}.path-wrap{grid-template-columns:repeat(5,minmax(0,1fr))}.island-card{min-width:132px;width:40vw}.map-canvas{min-height:560px}.brand small{display:none}.panel,.side{padding:14px}}
</style>

<script>
const DATA = {"worlds":[["math","Bahía Cristalina","Matemáticas","#56a8ed","Biru","🧊","cristal"],["nature","Jardín Brotaluz","Medi Natural","#58b78a","Brot","🌱","flor"],["english","Islas del Crepúsculo","Inglés","#a98ce8","Lumi","☁️","nube"],["val","Valle Mandarina","Valenciano","#ef9c58","Espurna","🔥","linterna"],["span","Colinas de Rubí","Castellano","#ef817d","Rubi","🦊","libro"]],"questions":{"math":[{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{}],"nature":[{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{}],"english":[{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{}],"val":[{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{}],"span":[{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{}]}};
const WORLDS = DATA.worlds.map(([id,name,subject,color,character,emoji,reward])=>({id,name,subject,color,character:GUARDIAN_ILLUSTRATIONS[id]?.name||character,emoji,reward}));
const QUESTIONS = DATA.questions;
const KEY = 'vera_archipelago_magica_v1';
const DEFAULT_AVATAR = {skin:'#f7c8a9', hair:'#6c4b3d', shirt:'#5b83f1', accessory:'star'};
let state;
function prepareClassroomState(loaded={}){
state=structuredClone(loaded);
if(!state || typeof state!=='object' || Array.isArray(state))state={};
state.worlds ??= {};
state.motion ??= true;
state.week ??= 1;
state.clockVisible ??= true;
state.avatar = normalizeCharacter(state.avatar);
normalizeIllustratedAvatar();
state.characterSchemaVersion = 1;
state.customizationInventory ??= {owned:['outfit-blue'],claimed:[]};
state.futureFeatures ??= {currency:null,chests:null,shop:null};
state.avatarName ??= 'Explorador';
state.awardsSeen ??= {};
for(const [id] of DATA.worlds){state.worlds[id] = {results:{}, index:0, remaining:1800, started:false, reviewIndex:0, milestones:{}, unlockedScene:0,...state.worlds[id]};state.worlds[id].milestones ??= {};state.worlds[id].unlockedScene ??= 0}
}
prepareClassroomState();
let screen='home',active='math',review=false,feedback=null,selection='',pairState={},classState={},showHint=false,paused=false,expired=false,noTime=false,clockHandle=null,modal=null,recentUnlocks=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){return classroomScheduleSave()}
function st(id){return state.worlds[id]}
function world(id){return WORLDS.find(w=>w.id===id)}
function correctCount(id){return Object.values(st(id).results).filter(v=>v==='ok').length}
function attempted(id){return Object.keys(st(id).results).length}
function pending(id){return Object.entries(st(id).results).filter(([,v])=>v==='miss').map(([k])=>Number(k)).sort((a,b)=>a-b)}
function allDone(id){return attempted(id)===30}
function totalStars(){return WORLDS.reduce((a,w)=>a+correctCount(w.id),0)}
function completedWorlds(){return WORLDS.filter(w=>allDone(w.id)).length}
function plusWorlds(){return WORLDS.filter(w=>correctCount(w.id)===30).length}
function allExploration(){return WORLDS.every(w=>allDone(w.id))}
function allPlus(){return WORLDS.every(w=>correctCount(w.id)===30)}
function setApp(html){if(!classroomReady)return;$('app').innerHTML=html+(modal?renderModal():'')}
function btn(label,fn,cls='soft'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function everlunaCrossing(){
 const veil=$('everluna-crossing');
 veil.getAnimations().forEach(animation=>animation.cancel());
 if(!state.motion||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 veil.animate([{opacity:.64},{opacity:0}],{duration:440,easing:'ease-out'});
}
function go(next){const previous=screen;if(next!=='weekly-world')destroyWeeklyWorld();if(next!=='missions')destroyMagicMissions();cancelMapJourney();stopTimer();screen=next;if(next!=='question'){feedback=null;showHint=false;selection='';pairState={};classState={};paused=false;expired=false;noTime=false;recentUnlocks=[]}render();if(previous!==next&&[previous,next].some(view=>view==='world'||view==='weekly-world'))everlunaCrossing();window.scrollTo({top:0,behavior:state.motion&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'smooth':'instant'})}
function toggleMotion(){state.motion=!state.motion;document.body.classList.toggle('reduced',!state.motion);$('motionBtn').textContent='✨ Animación: '+(state.motion?'sí':'no');save()}

function continueWithoutTime(){expired=false;st(active).remaining=0;review=false;noTime=true;renderQuestion(false)}
function renderQuestion(reset=true){syncWorldScene();stopTimer();const w=world(active),p=st(active),i=currentIndex(),q=QUESTIONS[active][i];if(!q){screen='world';render();return}setApp(`<section class="screen question-grid"><div class="question-card"><div class="progress-banner"><span class="label">${w.emoji} ${w.name} · ${review?'🔎 Repaso':'📍 Prueba '+(i+1)+' de 30'}</span><span class="pill">${review?'Sin cronómetro':noTime?'⏱️ Sin tiempo':state.clockVisible?`⏱️ <span id="clock">${formatTime(p.remaining)}</span>`:'⏱️ Oculto'}</span></div>${expired&&!review&&!feedback?`<div class="feedback error"><h3>⏰ Tiempo terminado</h3><p>¡Buen trabajo! Todo está guardado. Puedes seguir sin reloj, sin perder estrellas.</p><div class="actions">${btn('Continuar sin tiempo','continueWithoutTime()','primary')}${btn('Guardar y salir',"go('world')")}</div></div>`:paused&&!feedback?`<div class="feedback"><h3>🌿 Pausa</h3><p>Descansa cuanto necesites. El reloj está detenido.</p><div class="actions">${btn('▶ Volver al juego','pauseGame()','primary')}</div></div>`:feedback?`<div class="feedback ${feedback.ok?'':'error'}"><div class="confetti">${companionArt(active,feedback.ok?'celebrate':'help',96)} ${feedback.ok?'⭐ 🌸 ✨':'🌱 💛'}</div><h3>${feedback.ok?'¡Lo has conseguido!':'Vamos a descubrirlo'}</h3><p>${esc(q.explain)}</p>${!feedback.ok&&review?'<p>Esta pregunta seguirá en tu lista para practicar otra vez.</p>':''}${modal?`<div class="medal unlock" style="margin-top:12px"><span class="icon">${modal.icon}</span><strong>${modal.title}</strong><div>${modal.text}</div></div>`:''}</div><div class="actions">${btn(review?'Siguiente repaso →':'Siguiente →','modal=null;nextQuestion()','primary')}${btn('Guardar y salir',"go('world')")}</div>`:`<div class="rowline" style="justify-content:space-between;margin-bottom:10px"><strong>${w.character} está contigo 🌟</strong><div class="rowline">${!review?btn(paused?'▶ Reanudar':'⏸ Pausa','pauseGame()','soft'):''}${!review?btn(state.clockVisible?'🙈 Ocultar reloj':'👁 Mostrar reloj','toggleClock()','soft'):''}</div></div><div class="prompt-title">${esc(q.prompt)}</div>${questionInput(q,i)}${showHint?`<div class="hint">${esc(hintFor(q,w))}</div>`:''}<div class="actions">${btn('Comprobar ✓','check()','primary')}${btn('💡 Pista','showHint=true;renderQuestion(false)')}${btn('Guardar y salir',"go('world')")}</div><p class="tag">Puedes leer con calma. Si te equivocas, verás una explicación y podrás seguir.</p>`}</div><div class="sidecol"><div class="side"><span class="label">🧭 Progreso</span><div class="compact"><div class="item"><span>⭐ Estrellas</span><strong>${correctCount(active)}/30</strong></div><div class="item"><span>🔎 Pendientes</span><strong>${pending(active).length}</strong></div><div class="item"><span>Tramo</span><strong>${review?'Repaso':Math.floor(i/6)+1} / 5</strong></div></div><div class="bar" style="margin-top:12px"><span style="width:${Math.round(correctCount(active)/30*100)}%"></span></div></div><div class="side"><span class="label">🌟 Hitos</span><div class="compact"><div class="item"><span>10 preguntas</span><strong>${st(active).milestones[10]?'✅':'○'}</strong></div><div class="item"><span>20 preguntas</span><strong>${st(active).milestones[20]?'✅':'○'}</strong></div><div class="item"><span>30 preguntas</span><strong>${st(active).milestones[30]?'✅':'○'}</strong></div></div></div><div class="side"><span class="label">🧍 Avatar</span><div style="display:grid;place-items:center">${renderAvatar(.72)}</div></div></div></section>`);if(!feedback&&!paused&&!expired)startTimer();if(WORLD_SCENES[active])decorateWorldQuestion(reset)}
function renderGarden(){setApp(`<section class="screen"><div class="panel"><span class="label">🌷 Tu lugar tranquilo</span><h1>Mi rincón de estrellas</h1><p>Cada seis estrellas de un mundo aparece un nuevo tesoro para tu jardín. Se desbloquean en orden, sin compras ni sorpresas aleatorias.</p><div class="garden-grid">${gardenDecorations().map(x=>`<div class="decor">${x}</div>`).join('')||'🌿 Tu jardín se llenará de tesoros cuando ganes estrellas.'}</div><h2 style="margin-top:20px">Medallas de la Semana 1</h2><div class="medals">${medalCards()}</div><div class="actions">${btn('📖 Pasaporte de aventuras',"go('passport')",'primary')}${btn('🗺️ Seguir explorando',"go('home')")}</div></div></section>`)}
function renderPassport(){setApp(`<section class="screen"><div class="panel"><span class="label">📖 Pasaporte de aventuras</span><h1>Los sellos de Everluna</h1><p>Un sello significa que has recorrido las 30 pruebas. La medalla Plus significa que también has recuperado todas las estrellas.</p><div class="medals">${WORLDS.map(w=>`<div class="side"><div style="display:grid;place-items:center">${companionArt(w.id,'welcome',84)}</div><h3>${w.name}</h3><p>${allDone(w.id)?'✅ Sello conseguido':'○ Sello pendiente'}</p><p>⭐ ${correctCount(w.id)}/30</p><p>${correctCount(w.id)===30?'🏅 Plus conseguida':'🔎 '+pending(w.id).length+' pendientes de repaso'}</p>${btn('Visitar mundo',`openWorld('${w.id}')`)}</div>`).join('')}</div><div class="actions">${btn('🌷 Mi rincón',"go('garden')",'primary')}${btn('🗺️ Volver a mundos',"go('home')")}</div></div></section>`)}
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='question'&&!review&&!feedback&&!paused){paused=true;stopTimer();save()}});if(!state.motion){document.body.classList.add('reduced')}$('motionBtn').textContent='✨ Animación: '+(state.motion?'sí':'no');classroomBoot();
</script>
</body>
</html>
